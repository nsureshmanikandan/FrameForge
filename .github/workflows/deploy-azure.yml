name: Deploy FrameForge to Azure

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:latest

      - name: Deploy to Azure Container Apps
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Update backend container app
        run: |
          az containerapp update \
            --name frameforge-backend \
            --resource-group ${{ secrets.AZURE_RG }} \
            --image ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:latest

      - name: Update frontend container app
        run: |
          az containerapp update \
            --name frameforge-frontend \
            --resource-group ${{ secrets.AZURE_RG }} \
            --image ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:latest
